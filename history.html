<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('load', function () {
        const loader = document.querySelector('.page-loader');
        if (loader) {
          setTimeout(() => loader.classList.add('hidden'), 700);
        }
      });
      const path = window.location.pathname;
      document.write(`<base href="${path.includes('/pages/') ? '../' : './'}">`);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History | BankGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="page-loader"><div class="spinner"></div></div>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Overview</a>
        <a href="prediction.html"><i class="fa-solid fa-magic"></i> Prediction</a>
        <a href="history.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      </aside>
      <main class="dashboard-main">
        <div class="topbar" data-aos="fade-down">
          <div class="search"><i class="fa-solid fa-search"></i><input type="text" placeholder="Search history entries" /></div>
          <div class="topbar-actions"><button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button><a class="btn btn-gradient" href="prediction.html">New Prediction</a></div>
        </div>
        <div class="table-card" data-aos="fade-up">
          <div class="table-toolbar"><div><h4>Prediction History</h4><div class="muted small">Recent churn assessments from sample records.</div></div><div class="controls"><button class="btn-outline">Export CSV</button><button class="btn-outline">Export PDF</button></div></div>
          <table>
            <thead><tr><th>Customer</th><th>Segment</th><th>Risk</th><th>Probability</th><th>Last Updated</th><th>Action</th></tr></thead>
            <tbody>
              <tr><td>Aria Patel</td><td>Premium</td><td><span class="badge high">High</span></td><td>78%</td><td>2h ago</td><td><button class="btn-outline">Open</button></td></tr>
              <tr><td>Leo Chen</td><td>Standard</td><td><span class="badge medium">Medium</span></td><td>54%</td><td>4h ago</td><td><button class="btn-outline">Open</button></td></tr>
              <tr><td>Nora Ruiz</td><td>Enterprise</td><td><span class="badge low">Low</span></td><td>21%</td><td>Yesterday</td><td><button class="btn-outline">Open</button></td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
  </body>
</html>
