<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('load', function () {
        const loader = document.querySelector('.page-loader');
        if (loader) {
          setTimeout(() => loader.classList.add('hidden'), 700);
        }
      });
      const path = window.location.pathname;
      document.write(`<base href="${path.includes('/pages/') ? '../' : './'}">`);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | BankGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="page-loader"><div class="spinner"></div></div>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Overview</a>
        <a href="prediction.html"><i class="fa-solid fa-magic"></i> Prediction</a>
        <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
        <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      </aside>
      <main class="dashboard-main">
        <div class="topbar" data-aos="fade-down">
          <h3>Profile</h3>
          <div class="topbar-actions"><button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button></div>
        </div>
        <div class="contact-grid">
          <div class="contact-card" data-aos="fade-up"><div class="avatar-lg">AM</div><h3 class="mt-3">Ava Morgan</h3><p class="muted">Senior Risk Strategist</p></div>
          <div class="contact-card" data-aos="fade-up" data-aos-delay="100"><div class="form-floating"><input type="text" placeholder="Full name" value="Ava Morgan" /><input type="email" placeholder="Email" value="ava@bankguard.ai" /><button class="btn btn-gradient">Save Profile</button></div></div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
  </body>
</html>
