<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('load', function () {
        const loader = document.querySelector('.page-loader');
        if (loader) {
          setTimeout(() => loader.classList.add('hidden'), 700);
        }
      });
      const path = window.location.pathname;
      document.write(`<base href="${path.includes('/pages/') ? '../' : './'}">`);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | BankGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="page-loader"><div class="spinner"></div></div>
    <nav class="navbar">
      <div class="container">
        <a href="../index.html" class="brand"><span class="brand-badge"><i class="fa-solid fa-shield-halved"></i></span> BankGuard AI</a>
        <div class="nav-actions"><button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button><a class="btn btn-gradient" href="register.html">Register</a></div>
      </div>
    </nav>

    <section class="section">
      <div class="container contact-grid">
        <div class="contact-card" data-aos="fade-up"><div class="eyebrow">Secure access</div><h2>Welcome back to the control center.</h2><p class="muted">Sign in to explore the dashboard, run predictions, and review insights.</p></div>
        <div class="contact-card" data-aos="fade-up" data-aos-delay="100">
          <form class="form-floating">
            <input type="email" placeholder="Email address" />
            <input type="password" placeholder="Password" />
            <button class="btn btn-gradient" type="button" onclick="window.location.href='dashboard.html'">Sign In</button>
          </form>
        </div>
      </div>
    </section>

    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
  </body>
</html>
