<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('load', function () {
        const loader = document.querySelector('.page-loader');
        if (loader) {
          setTimeout(() => loader.classList.add('hidden'), 700);
        }
      });
      const path = window.location.pathname;
      document.write(`<base href="${path.includes('/pages/') ? '../' : './'}">`);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | BankGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="page-loader"><div class="spinner"></div></div>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <a href="dashboard.html" class="active"><i class="fa-solid fa-gauge-high"></i> Overview</a>
        <a href="prediction.html"><i class="fa-solid fa-magic"></i> Prediction</a>
        <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
        <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
      </aside>
      <main class="dashboard-main">
        <div class="topbar" data-aos="fade-down">
          <div class="search"><i class="fa-solid fa-search"></i><input type="text" placeholder="Search customers or insights" /></div>
          <div class="topbar-actions">
            <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-bell"></i></button>
            <a class="btn btn-gradient" href="prediction.html">Run Prediction</a>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="stat-card" data-aos="fade-up"><div class="value" data-count="14232" data-suffix="">0</div><div class="label">Total Customers</div></div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="100"><div class="value" data-count="3105" data-suffix="">0</div><div class="label">High-Risk Customers</div></div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="200"><div class="value" data-count="892" data-suffix="%">0</div><div class="label">Prediction Accuracy</div></div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="300"><div class="value" data-count="928" data-suffix="k">0</div><div class="label">Revenue Saved</div></div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="400"><div class="value" data-count="7612" data-suffix="">0</div><div class="label">Active Customers</div></div>
          <div class="stat-card" data-aos="fade-up" data-aos-delay="500"><div class="value" data-count="972" data-suffix="%">0</div><div class="label">Retention Rate</div></div>
        </div>

        <div class="chart-grid mt-3">
          <div class="chart-card" data-aos="fade-up"><h4>Monthly Prediction Trends</h4><canvas id="lineChart" height="240"></canvas></div>
          <div class="chart-card" data-aos="fade-up" data-aos-delay="100"><h4>Risk Distribution</h4><canvas id="doughnutChart" height="240"></canvas></div>
        </div>

        <div class="chart-grid mt-3">
          <div class="chart-card" data-aos="fade-up"><h4>Customer Geography</h4><canvas id="barChart" height="240"></canvas></div>
          <div class="chart-card" data-aos="fade-up" data-aos-delay="100"><h4>Product Mix</h4><canvas id="pieChart" height="240"></canvas></div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.Chart) {
          new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
              labels: ['Jan','Feb','Mar','Apr','May','Jun'],
              datasets:[{
                label:'Predictions',
                data:[120, 160, 145, 190, 175, 210],
                borderColor:'#5b6cff',
                backgroundColor:'rgba(91,108,255,.15)',
                tension:0.35,
                pointRadius: 4,
                pointHoverRadius: 6
              }]
            },
            options:{
              responsive:true,
              maintainAspectRatio:false,
              scales:{
                y:{
                  beginAtZero:true,
                  suggestedMax: 230
                }
              }
            }
          });
          new Chart(document.getElementById('doughnutChart'), { type: 'doughnut', data: { labels:['Low','Medium','High'], datasets:[{data:[55,25,20], backgroundColor:['#20c997','#ffb703','#ff6b6b']}] }, options:{responsive:true, maintainAspectRatio:false} });
          new Chart(document.getElementById('barChart'), { type: 'bar', data: { labels:['France','Spain','Germany'], datasets:[{data:[420,300,280], backgroundColor:['#5b6cff','#20c997','#ffb703']}] }, options:{responsive:true, maintainAspectRatio:false} });
          new Chart(document.getElementById('pieChart'), { type: 'pie', data: { labels:['Savings','Credit','Loans'], datasets:[{data:[42,31,27], backgroundColor:['#5b6cff','#20c997','#ff6b6b']}] }, options:{responsive:true, maintainAspectRatio:false} });
        }
      });
    </script>
    <script>AOS.init({ duration: 800, once: true });</script>
  </body>
</html>
