<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('load', function () {
        const loader = document.querySelector('.page-loader');
        if (loader) {
          setTimeout(() => loader.classList.add('hidden'), 700);
        }
      });
      const path = window.location.pathname;
      document.write(`<base href="${path.includes('/pages/') ? '../' : './'}">`);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | BankGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="page-loader"><div class="spinner"></div></div>
    <section class="section">
      <div class="container text-center" data-aos="fade-up">
        <div class="eyebrow">404 Error</div>
        <h1 style="font-size:clamp(3rem, 8vw, 5rem);">Oops! Page not found.</h1>
        <p class="muted">The page you are looking for may have moved or no longer exists.</p>
        <a href="../index.html" class="btn btn-gradient mt-3">Return Home</a>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
